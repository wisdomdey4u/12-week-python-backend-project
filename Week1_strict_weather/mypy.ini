# mypy.ini
[mypy]
python_version = 3.11
strict = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
show_error_codes = True



#  
1: Protocol (Structural) vs. ABC (Nominal) Typing

mypy accepts CustomProvider without explicit inheritance because typing.Protocol implements structural subtyping (also known as duck typing) at the static level.
• Why Protocol is accepted: When you use a Protocol, mypy only checks if the target class structural matches the interface. Since CustomProvider implements a fetch_weather method with a compatible signature ((str) -> dict[str, Any]), it implicitly satisfies the WeatherProvider contract. No explicit inheritance is required.
• How behavior differs with abc.ABC: An abc.ABC enforces nominal subtyping. If WeatherProvider were an ABC, mypy would reject CustomProvider outright, throwing a type mismatch error because CustomProvider is not explicitly declared as a subclass (class CustomProvider(WeatherProvider):).


2: The Callable Object (Functor) Pattern

Implementing __call__ turns instances of WeatherService into callables (also known as the Functor pattern).
• Architectural Framework Integration: This enables seamless integration with frameworks like FastAPI or dependency injection systems by allowing objects to mimic standard functions. For example, in FastAPI dependencies or processing pipelines, you can pass a configured stateful instance (WeatherService(provider=...)) wherever a regular function callback is expected. This achieves clean separation of concerns and facilitates easy mocking during testing.
• State Retention: State retention works via instance attributes (self). When you instantiate WeatherService, its configuration or state (like a cache, API clients, or counters) is stored in its closure/namespace. Multiple calls to service("location") execute the __call__ logic, but they all mutate or read from that same persistent, shared instance state.


3: Contravariance & Return Type Covariance Violations

mypy --strict will flag two specific type errors based on the Liskov Substitution Principle (LSP):

Error Area	Found Type	Expected Protocol Type	Why mypy Flags It
Return Type	Any	dict[str, Any]	Return type covariance violation. A subclass or implementation must return a more specific or equal type than the base contract. Replacing a strict dictionary return type with Any completely breaks type safety.

Error Area	Found Type	Expected Protocol Type	Why mypy Flags It
Return Type	Any	dict[str, Any]	Return type covariance violation. A subclass or implementation must return a more specific or equal type than the base contract. Replacing a strict dictionary return type with Any completely breaks type safety.
Argument Type	str | None	str	Note: While it makes the parameter broader (which is contravariantly safe for execution, as it accepts everything the protocol demands plus None), mypy --strict may still flag structural mismatch warnings depending on your precise assignment context if strict strictness options require strict method compatibility matching.


